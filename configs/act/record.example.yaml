robot:
  type: piper
  can_interface: can0
  bitrate: 1000000
  include_gripper: true
  use_degrees: false
cameras:
  front: {index_or_path: 0, width: 640, height: 480, fps: 30}
  wrist: {index_or_path: 2, width: 640, height: 480, fps: 30}
teleop:
  type: so101_leader
  port: /dev/ttyACM0
  id: so101_leader_01
dataset:
  repo_id: local/piper_record_test
  root: $HOME/lerobot_work/data/piper_record_test
  task: Put the banana on the plate.
  num_episodes: 50
  episode_time_s: 30
  reset_time_s: 15
  fps: 15
  streaming_encoding: true
  encoder_threads: 2
  rgb_crf: 20
  push_to_hub: false
